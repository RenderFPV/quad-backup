[package]
name = "quad-backup"
version = "2.0.0"
edition = "2021"
description = "Backs up Betaflight flight controllers when they're plugged in, then opens Betaflight"
build = "build.rs"

[[bin]]
name = "QuadBackup"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
regex = "=1.11.1"
chrono = { version = "=0.4.40", default-features = false, features = ["clock"] }
serialport = { version = "=4.6.1", default-features = false }
# wgpu (Direct3D / Metal / Vulkan) rather than OpenGL: OpenGL crashed when Windows went to sleep
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
tiny-skia = "=0.11.4"

# Windows: Win32 APIs, the registry, a tray icon, native folder pickers
[target.'cfg(windows)'.dependencies]
tray-icon = "=0.20.1"
rfd = "=0.15.3"
winreg = "=0.55.0"
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Mac: menu bar icon, native folder pickers
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "=0.20.1"
rfd = "=0.15.3"
libc = "0.2"

# Linux: a pure-Rust tray (StatusNotifierItem over D-Bus) and the desktop portal for folder pickers,
# so nothing needs GTK
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.1", default-features = false, features = ["async-io", "blocking"] }
rfd = { version = "=0.15.3", default-features = false, features = ["xdg-portal", "async-std"] }
libc = "0.2"

[build-dependencies]
winresource = "=0.1.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
